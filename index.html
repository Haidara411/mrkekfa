        </div>
    </noscript>

    <script>
    (async () => {
        const KEY = new TextEncoder().encode("mrkekfa_secret_key");
        try {
            const res = await fetch('bundle.bin');
            if (!res.ok) throw new Error("تعذر جلب ملف الحزمة الثنائية");
            const buffer = await res.arrayBuffer();
            const bytes = new Uint8Array(buffer);

            // فك التشفير
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] ^= KEY[i % KEY.length];
            }

            // فك الضغط في الذاكرة
            const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
            const htmlContent = await new Response(stream).text();

            // حقن وتشغيل الموقع الكامل
            document.open();
            document.write(htmlContent);
            document.close();
        } catch (err) {
            document.body.innerHTML = '<p style="color:#ef4444;font-family:sans-serif;">فشل تحميل التطبيق الثنائي.</p>';
            console.error(err);
        }
    })();
    </script>
